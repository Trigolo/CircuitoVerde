<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CircuitoVerde · Economia circular de eletrônicos</title>
  <!-- Aplica o tema salvo antes de desenhar a página (evita "piscar" branco no tema escuro) -->
  <script>
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('cv_tema'); } catch (e) {}
      if (!tema) tema = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      document.documentElement.dataset.tema = tema;
    })();
  </script>
  <!-- Fonte (se estiver sem internet, usa a fonte do sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tema-vibrante.css">
</head>
<body>
  <!-- Gradiente usado nas barras dos gráficos -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="grad-barras" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
  </defs></svg>
  <!-- Formas coloridas do fundo -->
  <div class="fundo-formas" aria-hidden="true"><span class="f1"></span><span class="f2"></span><span class="f3"></span></div>

  <!-- ===== Barra superior com o menu ===== -->
  <header class="topo" id="topo">
    <a href="#" class="marca" id="logo" aria-label="CircuitoVerde: ir para o início">
      <svg class="logo-svg" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="grad-logo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#10B981"/><stop offset=".55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
          </linearGradient>
          <marker id="seta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
          </marker>
        </defs>
        <g class="logo-anel">
          <path class="arco" d="M27.88 9.51 A15 15 0 0 1 37.59 30.34" marker-end="url(#seta)"/>
          <path class="arco" d="M34.61 34.61 A15 15 0 0 1 11.71 32.6" marker-end="url(#seta)"/>
          <path class="arco" d="M9.51 27.88 A15 15 0 0 1 22.69 9.06" marker-end="url(#seta)"/>
        </g>
        <g class="logo-chip">
          <rect x="18" y="18" width="12" height="12" rx="2.5"/>
          <path d="M21 16v2M24 16v2M27 16v2M21 30v2M24 30v2M27 30v2M16 21h2M16 24h2M16 27h2M30 21h2M30 24h2M30 27h2"/>
        </g>
      </svg>
      <span class="marca-texto"><strong>Circuito<span>Verde</span></strong></span>
    </a>

    <nav id="menu" class="nav-topo" aria-label="Menu principal"></nav>

    <div class="topo-direita">
      <div class="api-status" id="api-status" title="Conexão com a API"><span class="ponto"></span><span class="texto">Verificando API...</span></div>
      <button class="botao-tema" id="botao-tema" aria-label="Alternar tema claro e escuro" title="Alternar tema">
        <svg class="ic-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <div id="sessao" class="sessao"></div>
    </div>
  </header>

  <div id="aviso" class="aviso escondido" role="status"></div>
  <span id="trilha" hidden></span>
  <main id="conteudo"></main>

  <!-- ===== Celular: barra inferior + folha "Mais" ===== -->
  <nav class="barra-inferior" id="barra-inferior" aria-label="Menu rápido"></nav>
  <button id="abrir-menu" hidden aria-label="Abrir menu"></button>
  <div class="fundo-menu" id="fundo-menu"></div>
  <aside class="folha-mais" id="lateral" aria-label="Todas as telas">
    <div class="folha-alca"></div>
    <div id="menu-mais"></div>
  </aside>

  <!-- Tooltip dos gráficos -->
  <div id="tooltip" class="tooltip" role="tooltip"></div>

  <!-- Janela modal reutilizável -->
  <div id="modal" class="modal escondido" role="dialog" aria-modal="true">
    <div class="modal-caixa">
      <button class="fechar" id="modal-fechar" aria-label="Fechar">×</button>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <!-- Bibliotecas locais (pasta vendor): funcionam sem internet -->
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="app-v2.js"></script>
  <script src="assistente.js"></script>
  <script src="app-v3.js"></script>
</body>
</html>
